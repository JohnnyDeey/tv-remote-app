<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0a">
<title>TV Remote</title>
<link rel="manifest" href="#" id="manifest-link">
<link rel="icon" type="image/svg+xml" id="favicon-link">
<link rel="apple-touch-icon" id="apple-icon-link">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  :root {
    --bg: #0a0a0a;
    --surface: #151515;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #4fc3f7;
    --accent-dim: #1a3a4a;
    --text: #f0f0f0;
    --text-dim: #888;
    --btn: #1e1e1e;
    --btn-hover: #2a2a2a;
    --btn-active: #333;
    --red: #ef5350;
    --green: #66bb6a;
    --radius: 14px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 12px 32px;
    overflow-x: hidden;
  }

  /* STATUS BAR */
  .status-bar {
    width: 100%;
    max-width: 380px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 12px;
  }
  .status-bar h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .connecting-dots span {
    display: inline-block;
    animation: blink 1s infinite;
    color: #f9a825;
    font-size: 18px;
    font-weight: 900;
  }
  .connecting-dots span:nth-child(2) { animation-delay: 0.2s; }
  .connecting-dots span:nth-child(3) { animation-delay: 0.4s; }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }
  .dot.connected { background: var(--green); }

  /* REMOTE BODY */
  .remote {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* SECTIONS */
  .section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px;
    border: 1px solid var(--border);
  }

  /* TRACKPAD */
  .trackpad-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .trackpad-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .trackpad {
    width: 100%;
    height: 160px;
    background: var(--surface2);
    border-radius: 12px;
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .trackpad:active { border-color: var(--accent); }
  .trackpad-hint {
    font-size: 12px;
    color: var(--border);
    pointer-events: none;
    user-select: none;
    text-align: center;
    line-height: 1.8;
  }
  .trackpad-ripple {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transform: scale(0);
    pointer-events: none;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .trackpad-ripple.show {
    opacity: 0.25;
    transform: scale(1);
  }
  .trackpad-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .tp-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, transform 0.1s;
  }
  .tp-btn:active { background: var(--btn-active); transform: scale(0.96); }
  .tp-btn.click-btn {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  /* TOP ROW - POWER + SOURCE + SETTINGS */
  .top-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  /* BUTTON BASE */
  .btn {
    background: radial-gradient(circle at 35% 35%, #3a3a3a, #1a1a1a);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    user-select: none;
    transition: background 0.1s;
    -webkit-user-select: none;
    position: relative;
    box-shadow: 0 8px 0 #000, 0 10px 20px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .btn:active {
    background: radial-gradient(circle at 35% 35%, #2a2a2a, #151515);
    box-shadow: 0 2px 0 #000, inset 0 -1px 3px rgba(0,0,0,0.4);
    transform: translateY(4px);
  }
  .btn .icon {
    font-size: 20px;
    line-height: 1;
    color: var(--text);
  }
  .btn.power { color: var(--red); }
  .btn.power .icon { color: var(--red); }
  .btn.accent-btn { border-color: var(--accent-dim); }
  .btn.accent-btn .icon { color: var(--accent); }

  /* STREAMING ROW */
  .stream-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stream-btn {
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    padding: 10px 4px;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, transform 0.1s;
    letter-spacing: 0.3px;
  }
  .stream-btn:active { background: var(--btn-active); transform: scale(0.95); }
  .stream-btn.netflix { color: #e50914; }
  .stream-btn.youtube { color: #ff0000; }
  .stream-btn.prime { color: #00a8e0; }
  .stream-btn.disney { color: #113ccf; }

  /* D-PAD */
  .dpad-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .dpad-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 4px;
    max-width: 180px;
    margin: 0 auto;
  }
  .dpad-btn {
    background: radial-gradient(circle at 35% 35%, #3a3a3a, #1a1a1a);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 0 #000, inset 0 1px 0 rgba(255,255,255,0.12);
    font-size: 18px;
    aspect-ratio: 1;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, transform 0.1s;
  }
  .dpad-btn:active { background: radial-gradient(circle at 35% 35%, #2a2a2a, #111); box-shadow: 0 1px 0 #0a0a0a; transform: translateY(3px); }
  .dpad-ok {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .dpad-empty { visibility: hidden; }

  /* VOL/CH CONTROLS */
  .vol-ch {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 64px;
  }
  .vc-group {
    background: radial-gradient(circle at 35% 35%, #3a3a3a, #1a1a1a);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: visible;
    box-shadow: 0 8px 0 #000, 0 10px 20px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .vc-label {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
    padding: 5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  .vc-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s;
    color: var(--text);
  }
  .vc-btn:active { background: rgba(0,0,0,0.3); }
  .vc-mid {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .vc-mid:active { background: rgba(0,0,0,0.3); }

  /* NAV ROW - BACK HOME MENU */
  .nav-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  /* NUMBER PAD */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .num-btn {
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    padding: 14px 8px;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s, transform 0.1s;
  }
  .num-btn:active { background: var(--btn-active); transform: scale(0.95); }
  .num-btn.zero { grid-column: 2; }
  .num-btn.del-btn { color: var(--text-dim); font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222;
    color: var(--text);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    border: 1px solid var(--border);
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* CONNECT OVERLAY */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    padding: 24px;
  }
  .overlay h2 { font-size: 20px; font-weight: 700; }
  .overlay p { font-size: 14px; color: var(--text-dim); text-align: center; line-height: 1.6; }
  .overlay-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .overlay-btn:active { opacity: 0.8; }
  .overlay-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    width: 100%;
    max-width: 280px;
    text-align: center;
  }
  .overlay-input:focus { border-color: var(--accent); }
  .overlay-label { font-size: 13px; color: var(--text-dim); }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- CONNECT OVERLAY -->
<div class="overlay" id="overlay" style="display:none;">
  <div style="font-size:40px">📺</div>
  <h2>TV Remote</h2>
  <p>Enter your Samsung TV IP address to connect.<br>Your TV must be on the same WiFi.</p>
  <label class="overlay-label">TV IP Address</label>
  <input class="overlay-input" id="ip-input" type="text" value="192.168.68.106" placeholder="192.168.68.106" inputmode="decimal">
  <button class="overlay-btn" onclick="startConnect()">Connect to TV</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SETTINGS PANEL -->
<div id="settings-panel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;">
  <div style="width:100%;max-width:320px;background:var(--surface);border-radius:16px;padding:20px;border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:16px;font-weight:700;">⚙ Settings</span>
      <button onclick="closeSettings()" style="background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:12px;">
      <div style="font-size:11px;color:var(--text-dim);font-weight:700;letter-spacing:1px;margin-bottom:8px;">CONNECTION</div>
      <a id="cert-link" href="https://192.168.68.106:8002" target="_blank" style="display:block;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:11px;font-weight:700;padding:8px;text-align:center;margin-bottom:8px;text-decoration:none;">🔐 Trust Certificate (tap if not connecting)</a>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">TV IP: <span id="settings-ip" style="color:var(--accent);"></span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button onclick="closeSettings();document.getElementById('overlay').style.display='flex';" style="background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-size:12px;font-weight:700;padding:10px;cursor:pointer;">Switch TV</button>
        <button onclick="disconnect();closeSettings();" style="background:transparent;border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px;font-weight:700;padding:10px;cursor:pointer;">Disconnect</button>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:12px;">
        <div style="font-size:11px;color:var(--text-dim);font-weight:700;letter-spacing:1px;margin-bottom:8px;">DIGI BRIDGE</div>
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">Bridge IP: <span id="bridge-ip-display" style="color:var(--accent);">192.168.68.100:8765</span></div>
        <div style="display:flex;gap:8px;">
          <input id="bridge-ip-input" type="text" value="192.168.68.100" placeholder="192.168.68.100" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:8px;outline:none;">
          <button onclick="updateBridgeIp()" style="background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-size:12px;font-weight:700;padding:8px 12px;cursor:pointer;">Save</button>
        </div>
      </div>
  </div>
</div>

<!-- REMOTE UI -->
<div class="status-bar">
  <h1 id="app-title">📺 TV Remote</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="status-dot" id="tv-status-dot" style="display:flex;"></div>
    <div class="status-dot" id="digi-status-dot" style="display:none;"></div>
    <button id="apps-btn" onclick="showAppsLauncher()" style="display:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:16px;width:32px;height:32px;cursor:pointer;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button onclick="showSettings()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:16px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;">⚙</button>
  </div>
</div>

<!-- DEVICE SWITCHER -->
<div style="width:100%;max-width:380px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
  <button id="btn-samsung" onclick="switchDevice('samsung')" style="padding:10px;border-radius:10px;border:2px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 0 #0a0a0a,inset 0 1px 0 rgba(255,255,255,0.08);">📺 Samsung TV</button>
  <button id="btn-digi" onclick="switchDevice('digi')" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:radial-gradient(circle at 35% 35%,#3a3a3a,#1a1a1a);color:var(--text-dim);font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 0 #0a0a0a,inset 0 1px 0 rgba(255,255,255,0.08);">📡 DIGI Decoder</button>
</div>

<div class="remote" id="samsung-remote">
  <!-- TOP ROW: POWER / SOURCE / SETTINGS -->
  <div class="section">
    <div class="top-row">
      <button class="btn power" onclick="tvPower()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef5350" stroke-width="2.5" stroke-linecap="round">
          <path d="M12 3v9"/>
          <path d="M6.3 5.3a9 9 0 1 0 11.4 0"/>
        </svg>
      </button>
      <button class="btn accent-btn" onclick="sendKey('KEY_SOURCE')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="7" width="20" height="15" rx="2"/>
          <polyline points="17 2 12 7 7 2"/>
        </svg>
      </button>
      <button class="btn" onclick="sendKey('KEY_MENU')">
        <span class="icon">⚙️</span>
      </button>
    </div>
  </div>

  

  

  <!-- D-PAD + VOL/CH -->
  <div class="section">
    <div class="dpad-section">

      <!-- VOL -->
      <div class="vol-ch">
        <div class="vc-group">
          <div class="vc-label" style="pointer-events:none;">VOL</div>
          <div class="vc-btn" onmousedown="startRepeat('KEY_VOLUP','vol',1)" onmouseup="stopRepeat()" onmouseleave="stopRepeat()" ontouchstart="startRepeat('KEY_VOLUP','vol',1)" ontouchend="stopRepeat()">＋</div>
          <div class="vc-mid" onclick="toggleMute()" id="mute-btn" style="display:flex;align-items:center;justify-content:center;padding:6px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2" stroke-linecap="round" id="mute-svg">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line x1="23" y1="9" x2="17" y2="15" stroke="#ef5350"/>
              <line x1="17" y1="9" x2="23" y2="15" stroke="#ef5350"/>
            </svg>
          </div>
          <div class="vc-btn" onmousedown="startRepeat('KEY_VOLDOWN','vol',-1)" onmouseup="stopRepeat()" onmouseleave="stopRepeat()" ontouchstart="startRepeat('KEY_VOLDOWN','vol',-1)" ontouchend="stopRepeat()">－</div>
        </div>
      </div>

      <!-- D-PAD CIRCLE -->
      <div style="position:relative;flex:1;aspect-ratio:1;max-width:170px;max-height:170px;flex-shrink:0;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="90 90 320 320" width="100%" height="100%" style="filter:drop-shadow(0 8px 0 #000) drop-shadow(0 12px 20px rgba(0,0,0,0.8));">
          <defs>
            <radialGradient id="sectorGrad" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#4a4a4a"/>
              <stop offset="100%" stop-color="#1e1e1e"/>
            </radialGradient>
          </defs>
          <!-- UP sector -->
          <path d="M 338.874 130.914 L 277.951 193.101 C 257.967 179.635 231.936 179.534 212.701 192.887 L 148.514 130.004 C 201.815 83.107 283.046 83.527 338.873 130.914 Z" fill="url(#sectorGrad)" stroke="#0a0a0a" stroke-width="3" style="cursor:pointer;" onmousedown="startRepeat('KEY_UP');this.style.fill='#555'" onmouseup="stopRepeat();this.style.fill=''" onmouseleave="stopRepeat();this.style.fill=''" ontouchstart="startRepeat('KEY_UP');this.style.fill='#555'" ontouchend="event.preventDefault();stopRepeat();this.style.fill=''"/>

<script>
  // ─── CONFIG ───────────────────────────────────────────────
  let TV_IP = '192.168.68.106';
  let ws = null;
  let token = localStorage.getItem('samsung_tv_token') || '';
  let connected = false;
  let reconnectTimer = null;

  const APP_NAME = btoa('MyTVRemote');

  // ─── OVERLAY ──────────────────────────────────────────────
  function startConnect() {
    const input = document.getElementById('ip-input').value.trim();
    if (!input) return showToast('Enter a valid IP address');
    TV_IP = input;
    localStorage.setItem('tv_ip', TV_IP);
    document.getElementById('overlay').style.display = 'none';
    connect();
  }

  // ─── WEBSOCKET ────────────────────────────────────────────
    let connecting = false;

  function connect() {
    if (connecting || (ws && ws.readyState === WebSocket.OPEN)) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    connecting = true;
    tvState = 'connecting';
    const url = token
      ? `wss://${TV_IP}:8002/api/v2/channels/samsung.remote.control?name=${APP_NAME}&token=${token}`
      : `wss://${TV_IP}:8002/api/v2/channels/samsung.remote.control?name=${APP_NAME}`;
    const socket = new WebSocket(url);
    try {
      ws = socket;
    } catch(e) {
      connecting = false;
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      if (socket !== ws) { try { socket.close(); } catch(e){} return; }
      connecting = false;
      console.log('WS open');
    };

        ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.event === 'ms.channel.connect') {
          connected = true;
          tvState = 'connected';
          tvPoweredOff = false;
          if (msg.data && msg.data.token) {
            token = msg.data.token;
            localStorage.setItem('samsung_tv_token', token);
          }
          setTVStatus('connected');
        } else if (msg.event === 'ms.channel.unauthorized') {
          showToast('⚠ Check TV – allow the remote connection');
        } else if (msg.event === 'ms.channel.timeOut') {
          connected = false;
          tvState = 'standby';
          setTVStatus('standby');
          scheduleReconnect();
        }
      } catch(e) {}
    };
    ws.onerror = () => {
      if (socket !== ws) return;
      connecting = false;
      connected = false;
      if (tvState === 'connected') tvState = 'standby';
      else tvState = 'offline';
      setTVStatus(tvState);
    };
    ws.onclose = () => {
      if (socket !== ws) return;
      connecting = false;
      connected = false;
      if (tvState === 'connected') tvState = 'standby';
      setTVStatus(tvState);
      scheduleReconnect();
    };
  }

  function scheduleReconnect() {
    if (!manualDisconnect && token) {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 1000);
    }
  }

  function updateWifiIcon(iconId, state) {return;
    // state: 'connected' | 'disconnected' | 'connecting' | 'standby'
    const el = document.getElementById(iconId);
    if (!el) return;
    if (state === 'connecting') {
      el.innerHTML = `<span class="connecting-dots"><span>.</span><span>.</span><span>.</span></span>`;
    } else if (state === 'standby') {
      el.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f9a825" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    } else {
      const color = state === 'connected' ? '#66bb6a' : '#ef5350';

        const msg = JSON.parse(evt.data);
        if (msg.event === 'ed.installedApp.get') {
          const apps = msg.data.data;
          const list = apps.map(a => `${a.name}: ${a.appId}`).join('\n');
          document.getElementById('apps-list').innerText = list;
          ws.removeEventListener('message', handler);
        }
      } catch(e) {}
    });
  }

  document.addEventListener('contextmenu', e => e.preventDefault());

  // Prevent back button from closing app
  history.pushState(null, '', window.location.href);
  window.addEventListener('popstate', () => {
    history.pushState(null, '', window.location.href);

  // ─── LONG PRESS REPEAT ────────────────────────────────────
  let repeatTimer = null;
  let repeatInterval = null;
  let volLevel = parseInt(localStorage.getItem('vol_level') || '50');
  let volSliderTimer = null;

  function showVolSlider() {
    const popup = document.getElementById('vol-slider-popup');
    popup.style.display = 'flex';
    document.getElementById('vol-slider').value = volLevel;
    document.getElementById('vol-pct').textContent = volLevel + '%';
    clearTimeout(volSliderTimer);
    volSliderTimer = setTimeout(() => {
      popup.style.display = 'none';
    }, 3000);
  }

  function hideVolSlider() {
    clearTimeout(volSliderTimer);
    volSliderTimer = setTimeout(() => {
      document.getElementById('vol-slider-popup').style.display = 'none';
    }, 1500);
  }

  function onVolSlide(val) {
    const newVol = parseInt(val);
    const diff = newVol - volLevel;
    const key = diff > 0 ? 'KEY_VOLUP' : 'KEY_VOLDOWN';
    const steps = Math.abs(diff);
    for (let i = 0; i < steps; i++) {
      setTimeout(() => sendKey(key), i * 120);
    }
    volLevel = newVol;
    localStorage.setItem('vol_level', volLevel);
    document.getElementById('vol-pct').textContent = volLevel + '%';
    updateVolDisplay();
    clearTimeout(volSliderTimer);
  }

  function updateVolDisplay() {
    const bar = '█'.repeat(volLevel) + '░'.repeat(Math.max(0, 20 - volLevel));
    const pct = volLevel;
    const el = document.getElementById('vol-display');
    if (el) el.textContent = pct + '%';
    if (volLevel === 0) {
      const s1 = document.getElementById('mute-svg'); if(s1) s1.setAttribute('stroke','#ef5350');
      muted = true;
    } else {
      const s2 = document.getElementById('mute-svg'); if(s2) s2.setAttribute('stroke','#f0f0f0');
      muted = false;
    }
  }

  function startRepeat(key, type, delta) {
    if (type === 'digi') {
      digiKey(key);
      window._repeatFired = () => true;
      window._repeatKey = null;
      repeatTimer = setTimeout(() => {
        repeatInterval = setInterval(() => digiKey(key), 300);
      }, 500);
      window._digiHoldKey = null;
      return;
    }
    if (type === 'vol' && delta) {
      // Vol: send immediately then repeat
      sendKey(key);
      volLevel = Math.min(30, Math.max(0, volLevel + delta));
      localStorage.setItem('vol_level', volLevel);
      updateVolDisplay();
      repeatTimer = setTimeout(() => {
        repeatInterval = setInterval(() => {
          sendKey(key);
          volLevel = Math.min(30, Math.max(0, volLevel + delta));
          localStorage.setItem('vol_level', volLevel);
          updateVolDisplay();
        }, 300);
      }, 700);
    } else {
      // Dpad/CH: send immediately then repeat on hold
      sendKey(key);
      let fired = true;
      repeatTimer = setTimeout(() => {
        repeatInterval = setInterval(() => {
          sendKey(key);
        }, 50);
      }, 150);
      window._repeatFired = () => fired;
      window._repeatKey = null;
    }
  }

  

  function stopRepeat() {
    clearTimeout(repeatTimer);
    clearInterval(repeatInterval);
    repeatTimer = null;
    repeatInterval = null;
    if (window._digiHoldKey) {
      digiKey(window._digiHoldKey);
      window._digiHoldKey = null;
      return;
    }
    const shouldSend = window._repeatFired && !window._repeatFired() && window._repeatKey;
    const keyToSend = window._repeatKey;
    window._repeatFired = null;
    window._repeatKey = null;
    if (shouldSend) sendKey(keyToSend);
  }

  updateVolDisplay();

  
  function toggleMute() {
    muted = !muted;
    sendKey('KEY_MUTE');
    const svg = document.getElementById('mute-svg');
    if (svg) svg.setAttribute('stroke', muted ? '#ef5350' : '#f0f0f0');
  }

  
  function updateSens(val) {

  let cursorSize = parseInt(localStorage.getItem('cursor_size') || '3');

    }
  }

  function updateSens(val) {

  // ─── TRACKPAD ─────────────────────────────────────────────
  (function initTrackpad() {
    const pad = document.getElementById('trackpad');
    const kbInput = document.getElementById('kb-input');
    const ripple = document.getElementById('ripple');

    let lastX = null, lastY = null;
    let isTap = false;
    let tapTimer = null;
    let moveThreshold = 6; // px — below this = tap, above = drag
    let totalMove = 0;
    const SENSITIVITY = 0.4; // lower = slower cursor movement

    // Accumulated fractional movement
    let accumX = 0, accumY = 0;

    function sendMouseMove(dx, dy) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        method: 'ms.remote.control',
        params: {
          Cmd: 'Move',
          Position: { x: Math.round(dx), y: Math.round(dy), Time: Date.now() },
          TypeOfRemote: 'ProcessMouseDevice'
        }
      }));
    }

    function sendMouseClick() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        method: 'ms.remote.control',
        params: {
          Cmd: 'LeftClick',
          Position: { x: 0, y: 0, Time: Date.now() },
          TypeOfRemote: 'ProcessMouseDevice'
        }
      }));
      // ripple feedback
      ripple.classList.add('show');
      setTimeout(() => ripple.classList.remove('show'), 300);
    }

    pad.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      lastX = t.clientX;
      lastY = t.clientY;
      totalMove = 0;
      isTap = true;
      accumX = 0; accumY = 0;
    }, { passive: false });

    pad.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      const dx = (t.clientX - lastX) * SENSITIVITY;
      const dy = (t.clientY - lastY) * SENSITIVITY;
      totalMove += Math.abs(t.clientX - lastX) + Math.abs(t.clientY - lastY);
      if (totalMove > moveThreshold) isTap = false;

      accumX += dx;
      accumY += dy;

      // Only send when we have at least 1px of integer movement
      const ix = Math.trunc(accumX);
      const iy = Math.trunc(accumY);
      if (ix !== 0 || iy !== 0) {
        sendMouseMove(ix, iy);
        accumX -= ix;
        accumY -= iy;
      }

      lastX = t.clientX;
      lastY = t.clientY;
    }, { passive: false });

    pad.addEventListener('touchend', e => {
      e.preventDefault();
      if (isTap) sendMouseClick();
      lastX = null; lastY = null;
    }, { passive: false });

    // Also handle mouse (for laptop testing)
    let mouseDown = false;
    pad.addEventListener('mousedown', e => {
      mouseDown = true;
      lastX = e.clientX; lastY = e.clientY;
      totalMove = 0; isTap = true;
      accumX = 0; accumY = 0;
    });
    pad.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      const dx = (e.clientX - lastX) * SENSITIVITY;
      const dy = (e.clientY - lastY) * SENSITIVITY;
      totalMove += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
      if (totalMove > moveThreshold) isTap = false;
      accumX += dx; accumY += dy;
      const ix = Math.trunc(accumX), iy = Math.trunc(accumY);
      if (ix !== 0 || iy !== 0) { sendMouseMove(ix, iy); accumX -= ix; accumY -= iy; }
      lastX = e.clientX; lastY = e.clientY;
    });
    pad.addEventListener('mouseup', () => {
      if (isTap) sendMouseClick();
      mouseDown = false;
    });

    // ── KEYBOARD: focus hidden input to open phone keyboard ──
    // When TV opens a text field, user taps trackpad area to focus
    // hidden input — phone keyboard pops up — keystrokes stream to TV
    kbInput.addEventListener('input', async e => {
      const val = kbInput.value;
      if (!val) return;
      kbInput.value = ''; // clear immediately

      for (const char of val) {
        if (!ws || ws.readyState !== WebSocket.OPEN) break;
        ws.send(JSON.stringify({
          method: 'ms.channel.emit',
          params: {
            event: 'ed.sendText',
            to: 'host',
            data: { text: char, action_type: 'WRITE' }
          }
        }));
        await sleep(50);
      }
    });

    kbInput.addEventListener('keydown', e => {
      if (e.key === 'Backspace') { e.preventDefault(); sendKey('KEY_DEL'); }
      if (e.key === 'Enter')     { e.preventDefault(); sendKey('KEY_ENTER'); }
    });

    // Tap anywhere on trackpad section focuses the hidden input
    // so phone keyboard is always ready
    pad.addEventListener('click', () => kbInput.focus());
  })();

  // ─── TOAST ────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);

  // ─── INIT ─────────────────────────────────────────────────
  window.onload = () => {
    const savedIp = localStorage.getItem('tv_ip');
    if (savedIp) {
      TV_IP = savedIp;
      document.getElementById('ip-input').value = savedIp;
      document.getElementById('overlay').style.display = 'none';
      if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
        connect();
      }
    } else {
      document.getElementById('overlay').style.display = 'flex';
    }
    switchDevice(currentDevice);

    
  };

  // ─── TRACKPAD ─────────────────────────────────────────────
  let manualDisconnect = false;
  let tvState = 'offline'; // 'connected' | 'standby' | 'offline' | 'connecting'
  let digiFailCount = 0;
  let trackpadActive = false;
  let tpSens = parseFloat(localStorage.getItem('tp_sens') || '1.5');

  function toggleTrackpad() {
    trackpadActive = !trackpadActive;
    const pad = document.getElementById('trackpad');
    const padSection = document.getElementById('trackpad-section');
    const btn = document.getElementById('tp-toggle-btn');
    const icon = document.getElementById('tp-toggle-icon');
    if (padSection) padSection.style.display = trackpadActive ? 'block' : 'none';
    if (trackpadActive) {
      pad.style.borderColor = 'var(--accent)';
      btn.style.background = 'var(--accent)';
      btn.style.color = '#000';
      icon.textContent = '🖱';
      // activate mouse mode on TV — send multiple moves to force cursor to appear
      if (ws && ws.readyState === WebSocket.OPEN) {
        const wake = [1,2,3,2,1,0,-1,-2,-1,0];
        wake.forEach((v, i) => {
          setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ method:'ms.remote.control', params:{ Cmd:'Move', Position:{ x:v, y:v, Time:Date.now() }, TypeOfRemote:'ProcessMouseDevice' }}));
            }
          }, i * 50);
        });
      }
      showToast('Mouse ON — slide to move, tap to click');
    } else {
      pad.style.borderColor = '';
      btn.style.background = '';
      btn.style.color = '';
      icon.textContent = '🖱';
      showToast('Mouse OFF');
    }
  }

  (function() {
    const pad    = document.getElementById('trackpad');
    const ripple = document.getElementById('tp-ripple');
    const hint   = document.getElementById('tp-hint');
    let lx = null, ly = null, totalMove = 0, isTap = false;
    let ax = 0, ay = 0;

    function move(dx, dy) {
      if (!trackpadActive || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ method:'ms.remote.control', params:{ Cmd:'Move', Position:{ x:Math.round(dx), y:Math.round(dy), Time:Date.now() }, TypeOfRemote:'ProcessMouseDevice' }}));
    }
    function click() {
      if (!trackpadActive || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ method:'ms.remote.control', params:{ Cmd:'LeftClick', Position:{ x:0, y:0, Time:Date.now() }, TypeOfRemote:'ProcessMouseDevice' }}));
      ripple.style.opacity='0.3'; ripple.style.transform='scale(1)';
      setTimeout(()=>{ ripple.style.opacity='0'; ripple.style.transform='scale(0)'; }, 280);
    }

    pad.addEventListener('touchstart', e=>{ e.preventDefault(); if(!trackpadActive) return; const t=e.touches[0]; lx=t.clientX; ly=t.clientY; totalMove=0; isTap=true; ax=0; ay=0; hint.style.display='none'; },{passive:false});
    pad.addEventListener('touchmove',  e=>{ e.preventDefault(); if(!trackpadActive||lx===null) return; const t=e.touches[0]; const dx=(t.clientX-lx)*tpSens, dy=(t.clientY-ly)*tpSens; totalMove+=Math.abs(t.clientX-lx)+Math.abs(t.clientY-ly); if(totalMove>6) isTap=false; ax+=dx; ay+=dy; const ix=Math.trunc(ax),iy=Math.trunc(ay); if(ix||iy){move(ix,iy);ax-=ix;ay-=iy;} lx=t.clientX; ly=t.clientY; },{passive:false});
    pad.addEventListener('touchend',   e=>{ e.preventDefault(); if(!trackpadActive) return; if(isTap) click(); lx=null; ly=null; },{passive:false});

    let md=false;
    pad.addEventListener('mousedown', e=>{ if(!trackpadActive) return; md=true; lx=e.clientX; ly=e.clientY; totalMove=0; isTap=true; ax=0; ay=0; hint.style.display='none'; });
    window.addEventListener('mousemove', e=>{ if(!md||!trackpadActive) return; const dx=(e.clientX-lx)*tpSens, dy=(e.clientY-ly)*tpSens; totalMove+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly); if(totalMove>6) isTap=false; ax+=dx; ay+=dy; const ix=Math.trunc(ax),iy=Math.trunc(ay); if(ix||iy){move(ix,iy);ax-=ix;ay-=iy;} lx=e.clientX; ly=e.clientY; });
    window.addEventListener('mouseup', ()=>{ if(md&&isTap&&trackpadActive) click(); md=false; lx=null; });
  })();

  // ─── ICON + FAVICON + MANIFEST ────────────────────────────
  // Draw icon on canvas so we get a real PNG (works for favicon + apple-touch-icon)
  function makeIconDataUrl(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    // Background rounded rect
    const r = size * 0.22;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size-r);
    ctx.quadraticCurveTo(size, size, size-r, size);
    ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size-r);
    ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fillStyle = '#0a0a0a';
    ctx.fill();
    // TV screen shape
    const pad = size * 0.12;
    const sw = size - pad*2, sh = sw * 0.62;
    const sx = pad, sy = size * 0.18;
    const sr = size * 0.06;
    ctx.beginPath();
    ctx.moveTo(sx+sr, sy); ctx.lineTo(sx+sw-sr, sy);
    ctx.quadraticCurveTo(sx+sw, sy, sx+sw, sy+sr);
    ctx.lineTo(sx+sw, sy+sh-sr);
    ctx.quadraticCurveTo(sx+sw, sy+sh, sx+sw-sr, sy+sh);
    ctx.lineTo(sx+sr, sy+sh); ctx.quadraticCurveTo(sx, sy+sh, sx, sy+sh-sr);
    ctx.lineTo(sx, sy+sr); ctx.quadraticCurveTo(sx, sy, sx+sr, sy);
    ctx.closePath();
    ctx.fillStyle = '#1e1e1e';
    ctx.fill();
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = size * 0.03;
    ctx.stroke();
    // Screen glow dot
    ctx.beginPath();
    ctx.arc(sx+sw*0.5, sy+sh*0.5, size*0.08, 0, Math.PI*2);
    ctx.fillStyle = '#4fc3f7';
    ctx.fill();
    // Stand
    const standW = sw * 0.28, standH = size * 0.08;
    const standX = sx + (sw - standW)/2, standY = sy + sh;
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(standX, standY, standW, standH);
    ctx.fillRect(standX - standW*0.3, standY + standH - size*0.025, standW*1.6, size*0.025);
    return c.toDataURL('image/png');
  }

  const icon192 = makeIconDataUrl(192);
  const icon512 = makeIconDataUrl(512);
  const icon32  = makeIconDataUrl(32);

  // Favicon
  document.getElementById('favicon-link').href = icon32;

  // Apple touch icon (used when saved to iOS home screen)
  document.getElementById('apple-icon-link').href = icon192;

  // PWA Manifest
  const manifest = {
    name: 'TV Remote',
    short_name: 'TV Remote',
    description: 'Samsung TV Remote Control',
    start_url: '.',
    display: 'standalone',
    background_color: '#0a0a0a',
    theme_color: '#0a0a0a',
    orientation: 'portrait',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png' },
      { src: icon512, sizes: '512x512', type: 'image/png' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);
